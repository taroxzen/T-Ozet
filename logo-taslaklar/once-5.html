<!doctype html>
<html lang="tr">
<head>

<title>T-Özet — uygulanan ikonlar</title>
<style>

  h1 { font-size:20px; font-weight:600; margin:0 0 6px; letter-spacing:.04em; }
  p.sub { color:#6B7280; font-size:13px; margin:0 0 26px; }
  .row { display:flex; gap:28px; align-items:center; background:#0E0E10; border:1px solid #262629; border-radius:18px; padding:24px; margin-bottom:20px; }

  .item img { display:block; margin:0 auto 10px; }
  .item span { font-size:12px; color:#9CA3AF; }
  h2 { font-size:14px; font-weight:600; color:#9CA3AF; margin:30px 0 12px; letter-spacing:.06em; }
  .taskbar { height:56px; background:#202020; border:1px solid #333; border-radius:10px; display:flex; align-items:center; justify-content:center; gap:26px; }

</head>
<body>

<div class="row">
  <div class="item"><img src="../icons/icon128.png" width="128" height="128"><span>icon128.png</span></div>
  <div class="item"><img src="../icons/icon48.png" width="48" height="48"><span>icon48.png</span></div>
  <div class="item"><img src="../icons/icon16.png" width="16" height="16"><span>icon16.png</span></div>
  <div class="item"><img src="../icons/logo.svg" width="128" height="128"><span>logo.svg</span></div>

</html>
