<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>T-Özet — kalın logo örnekleri</title>
<style>
  body { margin:0; background:#050505; color:#E8E8E8; font-family: system-ui, sans-serif; padding:32px; }
  h1 { font-size:20px; font-weight:600; margin:0 0 6px; letter-spacing:.04em; }
  p.sub { color:#6B7280; font-size:13px; margin:0 0 26px; }
  .grid { display:flex; gap:24px; flex-wrap:wrap; }
  .card { background:#0E0E10; border:1px solid #262629; border-radius:18px; padding:18px; width:260px; }
  .card > img { width:128px; height:128px; display:block; margin:0 auto 14px; }
  .label { font-size:13px; color:#9CA3AF; margin-bottom:12px; }
  .sizes { display:flex; align-items:flex-end; gap:18px; justify-content:center; }
  .sizes img { margin:0; display:block; }
  h2 { font-size:14px; font-weight:600; color:#9CA3AF; margin:34px 0 12px; letter-spacing:.06em; }
  .taskbar { height:56px; background:#202020; border:1px solid #333; border-radius:10px; display:flex; align-items:center; justify-content:center; gap:22px; margin-bottom:12px; }
  .taskbar.light { background:#C8C8C8; border-color:#AAA; }
  .taskbar img { display:block; }
</style>
</head>
<body>
<h1>T-ÖZET — KALIN LOGO ÖRNEKLERİ</h1>
<p class="sub">Dolu zemin, kalın form, tek motif. 128 / 32 / 16 px.</p>
<div class="grid">
  <div class="card">
    <img src="logo-4-bold-t.svg" alt="4">
    <div class="label">4 — Kalın T + sıkıştırma</div>
    <div class="sizes">
      <img src="logo-4-bold-t.svg" width="32" height="32">
      <img src="logo-4-bold-t.svg" width="16" height="16">
    </div>
  </div>
  <div class="card">
    <img src="logo-5-compress-bars.svg" alt="5">
    <div class="label">5 — Üç satır → tek satır</div>
    <div class="sizes">
      <img src="logo-5-compress-bars.svg" width="32" height="32">
      <img src="logo-5-compress-bars.svg" width="16" height="16">
    </div>
  </div>
  <div class="card">
    <img src="logo-6-t-dot.svg" alt="6">
    <div class="label">6 — Kalın T + tek nokta</div>
    <div class="sizes">
      <img src="logo-6-t-dot.svg" width="32" height="32">
      <img src="logo-6-t-dot.svg" width="16" height="16">
    </div>
  </div>
  <div class="card">
    <img src="logo-7-robot-bold.svg" alt="7">
    <div class="label">7 — Kalın robot silueti</div>
    <div class="sizes">
      <img src="logo-7-robot-bold.svg" width="32" height="32">
      <img src="logo-7-robot-bold.svg" width="16" height="16">
    </div>
  </div>
</div>

<h2>WINDOWS GÖREV ÇUBUĞU — 16 PX</h2>
<div class="taskbar">
  <img src="logo-4-bold-t.svg" width="16" height="16">
  <img src="logo-5-compress-bars.svg" width="16" height="16">
  <img src="logo-6-t-dot.svg" width="16" height="16">
  <img src="logo-7-robot-bold.svg" width="16" height="16">
</div>
<div class="taskbar light">
  <img src="logo-4-bold-t.svg" width="16" height="16">
  <img src="logo-5-compress-bars.svg" width="16" height="16">
  <img src="logo-6-t-dot.svg" width="16" height="16">
  <img src="logo-7-robot-bold.svg" width="16" height="16">
</div>
</body>
</html>
