<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>T-Özet — son düzenleme</title>
<style>
  body { margin:0; background:#050505; color:#E8E8E8; font-family: system-ui, sans-serif; padding:32px; }
  h1 { font-size:20px; font-weight:600; margin:0 0 6px; letter-spacing:.04em; }
  p.sub { color:#6B7280; font-size:13px; margin:0 0 26px; }
  .grid { display:flex; gap:24px; flex-wrap:wrap; }
  .card { background:#0E0E10; border:1px solid #262629; border-radius:18px; padding:20px; width:300px; }
  .card > img { width:128px; height:128px; display:block; margin:0 auto 14px; }
  .label { font-size:13px; color:#9CA3AF; margin-bottom:12px; }
  .sizes { display:flex; align-items:flex-end; gap:20px; justify-content:center; }
  .sizes img { margin:0; display:block; }
  h2 { font-size:14px; font-weight:600; color:#9CA3AF; margin:34px 0 12px; letter-spacing:.06em; }
  .taskbar { height:56px; background:#202020; border:1px solid #333; border-radius:10px; display:flex; align-items:center; justify-content:center; gap:26px; margin-bottom:12px; }
  .taskbar.light { background:#C8C8C8; border-color:#AAA; }
</style>
</head>
<body>
<h1>T-ÖZET — SON DÜZENLEME</h1>
<p class="sub">5b genişletildi. 128 / 32 / 16 px.</p>
<div class="grid">
  <div class="card">
    <img src="logo-5b-daralmalı.svg" alt="önce">
    <div class="label">Önce — 5b</div>
    <div class="sizes">
      <img src="logo-5b-daralmalı.svg" width="32" height="32">
      <img src="logo-5b-daralmalı.svg" width="16" height="16">
    </div>
  </div>
  <div class="card">
    <img src="logo-5b-genis.svg" alt="son">
    <div class="label">Son — 5b geniş</div>
    <div class="sizes">
      <img src="logo-5b-genis.svg" width="32" height="32">
      <img src="logo-5b-genis.svg" width="16" height="16">
    </div>
  </div>
</div>

<h2>WINDOWS GÖREV ÇUBUĞU — 16 PX</h2>
<div class="taskbar">
  <img src="logo-5b-daralmalı.svg" width="16" height="16">
  <img src="logo-5b-genis.svg" width="16" height="16">
</div>
<div class="taskbar light">
  <img src="logo-5b-daralmalı.svg" width="16" height="16">
  <img src="logo-5b-genis.svg" width="16" height="16">
</div>
</body>
</html>
