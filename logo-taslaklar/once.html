<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>T-Özet logo örnekleri</title>
<style>
  body { margin:0; background:#050505; color:#E8E8E8; font-family: system-ui, sans-serif; padding:32px; }
  h1 { font-size:20px; font-weight:600; margin:0 0 24px; letter-spacing:.04em; }
  .grid { display:flex; gap:32px; flex-wrap:wrap; }
  .card { background:#0E0E10; border:1px solid #262629; border-radius:18px; padding:20px; width:300px; }
  .card img { width:128px; height:128px; display:block; margin:0 auto 16px; }
  .label { font-size:13px; color:#9CA3AF; margin-bottom:12px; }
  .sizes { display:flex; align-items:flex-end; gap:16px; justify-content:center; }
  .sizes img { margin:0; display:block; }
</style>
</head>
<body>
<h1>T-ÖZET — LOGO ÖRNEKLERİ</h1>
<div class="grid">
  <div class="card">
    <img src="logo-1-t-compress.svg" alt="1">
    <div class="label">1 — T + sıkıştırma oku</div>
    <div class="sizes">
      <img src="logo-1-t-compress.svg" width="48" height="48">
      <img src="logo-1-t-compress.svg" width="16" height="16">
    </div>
  </div>
  <div class="card">
    <img src="logo-2-page-spark.svg" alt="2">
    <div class="label">2 — Sayfa + AI kıvılcımı</div>
    <div class="sizes">
      <img src="logo-2-page-spark.svg" width="48" height="48">
      <img src="logo-2-page-spark.svg" width="16" height="16">
    </div>
  </div>
  <div class="card">
    <img src="logo-3-robot-summary.svg" alt="3">
    <div class="label">3 — Robot + özet satırları</div>
    <div class="sizes">
      <img src="logo-3-robot-summary.svg" width="48" height="48">
      <img src="logo-3-robot-summary.svg" width="16" height="16">
    </div>
  </div>
</div>
</body>
</html>
