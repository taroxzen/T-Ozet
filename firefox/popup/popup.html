<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>T-Özet</title>
  <link rel="stylesheet" href="popup.css">
  <style>
    .presets-container {
      margin: 10px 0;
    }
    .preset-label {
      font-size: 11px;
      font-weight: 600;
      color: #94a3b8;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
    }
    .presets-list {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }
    .popup-preset-btn {
      padding: 7px 8px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 6px;
      color: #cbd5e1;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      text-align: left;
      transition: all 0.15s;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .popup-preset-btn:hover {
      border-color: #38bdf8;
      color: #ffffff;
    }
    .popup-preset-btn.active {
      background: #2563eb;
      border-color: #38bdf8;
      color: #ffffff;
      font-weight: bold;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.35);
    }
    .custom-popup-box {
      margin: 8px 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .custom-popup-textarea {
      width: 100%;
      box-sizing: border-box;
      height: 55px;
      background: #020617;
      border: 1px solid #334155;
      border-radius: 6px;
      color: #f8fafc;
      font-size: 11px;
      padding: 6px;
      resize: vertical;
      font-family: inherit;
    }
    .sync-hint {
      font-size: 10px;
      color: #64748b;
      margin-top: 4px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="popup-container">
    <div class="popup-header">
      <div class="brand">
        <img src="../icons/icon48.png" alt="Logo" class="avatar-logo">
        <div class="brand-text">
          <h1>T-Özet</h1>
          <span style="font-size: 10.5px; color: #38bdf8;">Hızlı & Doğrudan Özetleyici</span>
        </div>
      </div>
      <button id="btn-options" class="icon-btn" title="Ayarlar">⚙️</button>
    </div>

    <!-- 8 PROMPT ŞABLONU SEÇİCİSİ -->
    <div class="presets-container">
      <div class="preset-label">
        <span>Aktif Özet Şablonu:</span>
        <span id="active-preset-name" style="color: #38bdf8; font-weight: bold;">✨ Basit Özet</span>
      </div>
      <div class="presets-list" id="popup-presets-list">
        <button class="popup-preset-btn" data-preset="apple">✨ Basit Özet</button>
        <button class="popup-preset-btn" data-preset="two_words">⚡ 2 Kelimede Flaş</button>
        <button class="popup-preset-btn" data-preset="bullets">📌 Madde Madde</button>
        <button class="popup-preset-btn" data-preset="table">📊 Tablo Formatı</button>
        <button class="popup-preset-btn" data-preset="five_w">📰 5N1K Analizi</button>
        <button class="popup-preset-btn" data-preset="eli5">🧒 Basit Anlat</button>
        <button class="popup-preset-btn" data-preset="executive">💼 Yönetici Özeti</button>
        <button class="popup-preset-btn" data-preset="custom">✍️ Özel Prompt</button>
      </div>
    </div>

    <!-- ÖZEL PROMPT YAZMA ALANI -->
    <div class="custom-popup-box" id="popup-custom-box" style="display: none;">
      <textarea id="popup-custom-textarea" class="custom-popup-textarea" placeholder="Özel promptunuzu buraya yazın..."></textarea>
    </div>

    <div class="sync-hint">🔒 Seçtiğiniz şablon tüm tarayıcıda otomatik kaydedilir.</div>

    <!-- Ana Aksiyon Butonları -->
    <div class="actions">
      <button id="btn-summarize-page" class="btn-primary" title="Mevcut web sayfasını seçili şablonla doğrudan özetle">
        <span>⚡</span> Bu Sayfayı Direkt Özetle
      </button>
      <button id="btn-open-gemini-direct" class="btn-secondary" title="Temiz Gemini popup penceresi aç">
        <span>🚀</span> Gemini Popup Aç
      </button>
    </div>

    <!-- Geliştirici İmzası -->
    <div class="popup-footer">
      <span>🔒 Sıfır Veri Kaydı</span>
      <span style="color: #38bdf8; font-weight: 600;">👨‍💻 Taroxzen</span>
    </div>
  </div>
  <script type="module" src="popup.js"></script>
</body>
</html>
